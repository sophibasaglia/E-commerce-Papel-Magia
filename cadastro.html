<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papel & Magia - Cadastro e Pagamento</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="menu">
            <nav>
                <ul>
                    <li><a href="index.html"><img src="imagens/logo.png"
                                alt="Logo principal da papelaria Papel e Magia com tons de rosa" width="120" height="70"
                                class="logo-menu"></a></li>
                    <li><a href="index.html" class="produtos-menu">Início</a></li>
                    <li><a href="produto.html" class="produtos-menu">Produtos</a></li>
                    <li><a href="cadastro.html" class="produtos-menu">Cadastre-se!</a></li>
                    <li>
                        <div class="search-box">
                            <input type="text" placeholder="Busque aqui!">
                        </div>
                    </li>
                    <li><a href="carrinho.html"><img src="imagens/imagem-carrinho-compras.png"
                                alt="Ícone de carrinho de compras para visualizar minhas compras" width="50" height="50"
                                class="carrinho-menu"></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container-cadastro">
        <h1>Concluir Cadastro & Pagamento</h1>
        <p class="subtitulo-cadastro">Preencha os campos abaixo para finalizar o seu pedido com segurança.</p>

        <form action="#" method="POST" class="form-cadastro">
            
            <fieldset>
                <legend>1. Dados Pessoais</legend>
                <div class="grid-form">
                    <div class="campo flex-full">
                        <label for="nome-completo">Nome Completo:*</label>
                        <input type="text" id="nome-completo" name="nome" required placeholder="Digite seu nome completo">
                    </div>

                    <div class="campo">
                        <label for="email">E-mail:*</label>
                        <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF:*</label>
                        <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00">
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone / WhatsApp:*</label>
                        <input type="tel" id="telefone" name="telefone" required placeholder="(11) 99999-9999">
                    </div>

                    <div class="campo">
                        <label for="data-nascimento">Data de Nascimento:*</label>
                        <input type="date" id="data-nascimento" name="data_nascimento" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha:*</label>
                        <input type="password" id="senha" name="senha" required placeholder="Crie uma senha segura">
                    </div>

                    <div class="campo">
                        <label for="foto-perfil">Foto de Perfil (Opcional):</label>
                        <input type="file" id="foto-perfil" name="foto_perfil" accept="image/*">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>2. Endereço de Entrega</legend>
                <div class="grid-form">
                    <div class="campo">
                        <label for="cep">CEP:*</label>
                        <input type="text" id="cep" name="cep" required placeholder="00000-000">
                    </div>

                    <div class="campo flex-2">
                        <label for="rua">Rua / Logradouro:*</label>
                        <input type="text" id="rua" name="rua" required placeholder="Ex: Av. Paulista">
                    </div>

                    <div class="campo">
                        <label for="numero">Número:*</label>
                        <input type="text" id="numero" name="numero" required placeholder="123">
                    </div>

                    <div class="campo">
                        <label for="complemento">Complemento:</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Apto 4B, Bloco C">
                    </div>

                    <div class="campo">
                        <label for="bairro">Bairro:*</label>
                        <input type="text" id="bairro" name="bairro" required placeholder="Seu bairro">
                    </div>

                    <div class="campo">
                        <label for="cidade">Cidade:*</label>
                        <input type="text" id="cidade" name="cidade" required placeholder="Sua cidade">
                    </div>

                    <div class="campo">
                        <label for="estado">Estado:*</label>
                        <select id="estado" name="estado" required>
                            <option value="">Selecione...</option>
                            <option value="SP">São Paulo</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PR">Paraná</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="SC">Santa Catarina</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>3. Forma de Pagamento</legend>
                <div class="opcoes-pagamento">
                    <label class="card-pagamento">
                        <input type="radio" name="pagamento" value="pix" required>
                        <span class="conteudo-opcao">
                            <span class="icone-pagamento">⚡</span>
                            <strong>PIX</strong>
                            <small>Aprovação imediata</small>
                        </span>
                    </label>

                    <label class="card-pagamento">
                        <input type="radio" name="pagamento" value="cartao">
                        <span class="conteudo-opcao">
                            <span class="icone-pagamento">💳</span>
                            <strong>Cartão de Crédito</strong>
                            <small>Em até 6x sem juros</small>
                        </span>
                    </label>

                    <label class="card-pagamento">
                        <input type="radio" name="pagamento" value="boleto">
                        <span class="conteudo-opcao">
                            <span class="icone-pagamento">📄</span>
                            <strong>Boleto Bancário</strong>
                            <small>Vencimento em 3 dias</small>
                        </span>
                    </label>
                </div>
            </fieldset>

            <div class="checkout-footer">
                <label for="termos" class="label-termos">
                    <input type="checkbox" id="termos" name="termos" required>
                    Li e aceito os <a href="#">Termos de Uso</a> e Política de Privacidade.
                </label>

                <button type="submit" class="btn-submit">Concluir Cadastro e Pagar</button>
            </div>

        </form>
    </main>

    <footer class="container-rodape">
        <div class="direitos-autorais">
            <p>&copy; 2026 Papel & Magia. Todos os direitos reservados.</p>
        </div>
    </footer>
</body>

</html>
